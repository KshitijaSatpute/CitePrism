# CitePrism offline / data-sovereign profile.
#
#   docker compose -f compose.phase4.yml -f compose.offline.yml up --build
#
# Extraction, claim assessment and literature-lead generation run on a local
# model served by Ollama through its OpenAI-compatible API. No manuscript text
# leaves this host. Scholarly-index lookups, open-access full text and the
# Hugging Face inference API are disabled; references are reported as
# "not resolved (offline mode)" rather than as missing.
#
# Ollama cannot download models without network access. On a connected machine:
#     docker compose -f compose.offline.yml run --rm ollama-pull
# then move the `ollama-models` volume to the offline host.
# For a hard air gap, also block egress at the host firewall; this file removes
# the application's need for outbound access, it does not enforce isolation.

x-offline-env: &offline-env
  CITEPRISM_OFFLINE_MODE: "true"
  LLM_PROVIDER: openai_compatible
  CITEPRISM_ASSESSMENT_PROVIDER: openai_compatible
  OPENAI_COMPATIBLE_BASE_URL: http://ollama:11434/v1
  OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-llama3.1:8b-instruct-q4_K_M}
  CITEPRISM_SIMILARITY_BACKEND: ${CITEPRISM_SIMILARITY_BACKEND:-lexical}
  CITEPRISM_ENABLE_FULL_TEXT: "false"
  CITEPRISM_ENABLE_UNPAYWALL: "false"
  CITEPRISM_ENABLE_GAP_ANALYSIS: "false"

services:
  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.5.7
    profiles: ["prepare"]
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OPENAI_COMPATIBLE_MODEL:-llama3.1:8b-instruct-q4_K_M}"]

  api:
    environment:
      <<: *offline-env
    depends_on:
      ollama:
        condition: service_healthy

  worker:
    environment:
      <<: *offline-env
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
