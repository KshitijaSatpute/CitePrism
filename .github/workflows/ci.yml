name: citeprism-regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deterministic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-phase3.txt
      - run: python -m compileall -q config database src ui tests scripts database_manager.py pipeline_orchestrator.py streamlit_app.py citeprism_api.py
      - run: python scripts/verify_phase2.py
      - run: python -m unittest tests.test_phase3_auth tests.test_phase3_workspace tests.test_phase3_api -v
      - run: python -m unittest tests.test_phase4_contracts tests.test_phase4_workspace tests.test_phase4_runtime tests.test_phase4_evidence tests.test_phase4_api -v
      - run: python -c "from src.webapi.app import app; assert app.openapi()['info']['version'] == '1.0.0'"
      - run: git diff --check
  react-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  postgres-and-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citeprism_admin
          POSTGRES_PASSWORD: citeprism-admin-dev-only
          POSTGRES_DB: citeprism_trust_dev
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U citeprism_admin -d citeprism_trust_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CITEPRISM_TEST_ADMIN_DATABASE_URL: postgresql://citeprism_admin:citeprism-admin-dev-only@127.0.0.1:55432/citeprism_trust_dev
      CITEPRISM_TEST_DATABASE_URL: postgresql://citeprism_app:citeprism-app-dev-only@127.0.0.1:55432/citeprism_trust_dev
      CITEPRISM_TEST_RUNTIME_ROLE: citeprism_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-phase3.txt
      - name: Create separate runtime role in disposable CI database
        run: >-
          python -c "import os, pathlib, psycopg;
          c=psycopg.connect(os.environ['CITEPRISM_TEST_ADMIN_DATABASE_URL']);
          c.execute(pathlib.Path('database/dev_init/001_create_runtime_role.sql').read_text());
          c.commit(); c.close()"
      - run: python scripts/verify_phase2.py --require-postgres
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Check installed CLI and SQL outside checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          cp scripts/check_installed_wheel.py "$RUNNER_TEMP/check_installed_wheel.py"
          cd "$RUNNER_TEMP"
          python -I check_installed_wheel.py
          citeprism-trust --help
          citeprism-api --help
