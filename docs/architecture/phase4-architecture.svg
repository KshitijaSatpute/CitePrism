<text x="40" y="954" class="l" font-size="11.5" fill="#5b6b7c">Filled boxes are durable stores. Dashed borders mark components carried unchanged from an earlier phase.</text>
<text x="40" y="973" class="l" font-size="11.5" fill="#5b6b7c">Every store is tenant-scoped: a cross-tenant identifier resolves to “not found”, never to another organization’s row.</text>
<text x="40" y="992" class="l" font-size="11.5" fill="#b8791f">Quotation grounding proves attribution to a stored source snapshot. It does not establish that the citing interpretation is correct.</text>
