# CitePrism Phase 4 — durable runtime preview.
#
# This brings up the whole enterprise topology on one machine: PostgreSQL for
# the workspace, MinIO for S3-compatible object storage, the API, a separately
# scalable worker, and the web client. Every published port binds to loopback.
#
# It is a development preview, not a production topology. Before a release,
# resolve image tags to approved immutable digests, move every secret into a
# secret manager, and put an identity-aware proxy or OIDC issuer in front.
name: citeprism-phase4

x-runtime-env: &runtime-env
  CITEPRISM_BASE_DIR: /app
  CITEPRISM_WORKSPACE_BACKEND: postgres
  CITEPRISM_WORKSPACE_DATABASE_URL: postgresql://citeprism_workspace_app:citeprism-workspace-dev-only@workspace-db:5432/citeprism_workspace
  CITEPRISM_WORKSPACE_SCHEMA: citeprism_workspace
  CITEPRISM_OBJECT_BACKEND: s3
  CITEPRISM_S3_BUCKET: citeprism
  CITEPRISM_S3_ENDPOINT_URL: http://objects:9000
  CITEPRISM_S3_REGION: us-east-1
  CITEPRISM_S3_ADDRESSING: path
  CITEPRISM_S3_REQUIRE_VERSIONING: "false"
  CITEPRISM_S3_SERVER_SIDE_ENCRYPTION: ""
  AWS_ACCESS_KEY_ID: citeprism-dev
  AWS_SECRET_ACCESS_KEY: citeprism-dev-secret
  CITEPRISM_QUEUE_LEASE_SECONDS: "120"
  CITEPRISM_QUEUE_HEARTBEAT_SECONDS: "20"

services:
  workspace-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citeprism_workspace
      POSTGRES_USER: citeprism_admin
      POSTGRES_PASSWORD: citeprism-admin-dev-only
    volumes:
      - workspace_pgdata:/var/lib/postgresql/data
      - ./database/dev_init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeprism_admin -d citeprism_workspace"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  objects:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: citeprism-dev
      MINIO_ROOT_PASSWORD: citeprism-dev-secret
    volumes:
      - workspace_objects:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: create the bucket and apply the workspace schema, then exit.
  provision:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      <<: *runtime-env
      CITEPRISM_WORKSPACE_MIGRATION_DATABASE_URL: postgresql://citeprism_admin:citeprism-admin-dev-only@workspace-db:5432/citeprism_workspace
    depends_on:
      workspace-db:
        condition: service_healthy
      objects:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python -c "
        import boto3, botocore
        client = boto3.client('s3', endpoint_url='http://objects:9000',
            aws_access_key_id='citeprism-dev', aws_secret_access_key='citeprism-dev-secret',
            region_name='us-east-1',
            config=botocore.config.Config(s3={'addressing_style':'path'}))
        try:
            client.create_bucket(Bucket='citeprism')
            print('bucket created')
        except client.exceptions.BucketAlreadyOwnedByYou:
            print('bucket already present')
        " &&
        python scripts/migrate_workspace.py --runtime-role citeprism_workspace_app
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      <<: *runtime-env
      CITEPRISM_AUTH_MODE: ${CITEPRISM_AUTH_MODE:-local}
      # The API serves requests; the worker service executes audits.
      CITEPRISM_RUN_EMBEDDED_WORKER: "false"
    depends_on:
      provision:
        condition: service_completed_successfully
    volumes:
      - citeprism-data:/app/data
      - citeprism-database:/app/database
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/logs:size=64m
      - /app/cache:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      <<: *runtime-env
    depends_on:
      provision:
        condition: service_completed_successfully
    command: ["python", "scripts/worker.py", "--concurrency", "2"]
    volumes:
      - citeprism-data:/app/data
      - citeprism-database:/app/database
    # Scale horizontally: docker compose -f compose.phase4.yml up --scale worker=3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/logs:size=64m
      - /app/cache:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  workspace_pgdata:
  workspace_objects:
  citeprism-data:
  citeprism-database:
