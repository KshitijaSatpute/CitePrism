services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      CITEPRISM_BASE_DIR: /app
      CITEPRISM_AUTH_MODE: ${CITEPRISM_AUTH_MODE:-local}
    volumes:
      - citeprism-data:/app/data
      - citeprism-database:/app/database
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/logs:size=64m
      - /app/cache:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  citeprism-data:
  citeprism-database:
