[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citeprism"
version = "4.0.0a1"
description = "Human-supervised evidence assurance prototype for citation review"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.scripts]
citeprism-trust = "src.trust.cli:main"
citeprism-api = "src.webapi.cli:main"

[tool.setuptools]
py-modules = ["database_manager", "pipeline_orchestrator", "streamlit_app", "citeprism_api"]

[tool.setuptools.packages.find]
include = ["config*", "database*", "src*", "ui*"]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-phase3.txt"]}

[tool.setuptools.package-data]
"database.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
